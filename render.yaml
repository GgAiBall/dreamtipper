# Render 全栈部署配置（一并托管 Vue 前端 + Express 后端）
# https://render.com/docs/deploy#deploy-from-a-github-repository
services:
  - type: web
    name: dreamtipper
    env: node
    region: singapore
    rootDir: .
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: cd server && node index.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d