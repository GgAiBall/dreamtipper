# Render 全栈部署配置（一并托管 Vue 前端 + Express 后端）
# https://render.com/docs/deploy#deploy-from-a-github-repository
services:
  - type: web
    name: dreamtipper
    env: node
    region: singapore
    rootDir: .
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: cd server && node index.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # Turso 云数据库（在 Render 控制台手动填入，不要写进代码仓库）
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # 跳过示例/种子数据（已用真实人工数据，禁止再塞测试样本）
      - key: SKIP_SAMPLE_SEED
        value: 'true'
      # 竞彩官网比赛结果数据源（可选）。支持占位符 {weekday}{matchNo}{date}{league}{home}{away}
      # 例：https://your-source.com/api/result?wd={weekday}&no={matchNo}&date={date}
      # 未配置时「自动获取官网结果」会提示“未配置数据源”。
      - key: OFFICIAL_RESULT_API
        sync: false